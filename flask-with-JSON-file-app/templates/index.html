<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimalist To-Do App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>My To-Do List</h1>

    <!-- Task list will go here
    <ul>
        <!-- Later, Flask will loop through tasks and insert them here -->
        <li>Example task: Buy milk</li>
    </ul>

    <ul>
         {% for task in tasks %}
           <li class="{% if task['done'] %}completed{% endif %}">
              {{ task["title"] }}
              {% if task["done"] %}
                (completed)
              {% else %}
                <a href="/mark/{{ task['id'] }}">Mark Done</a>
              {% endif %}
              <a href="/delete/{{ task['id'] }}">Delete</a>
           </li>
         {% endfor %}
    </ul>

    <!-- Form to add new tasks (we’ll wire this up in Step 4) -->
    <form action="/add" method="post">
        <input type="text" name="task" placeholder="Enter new task">
        <button type="submit">Add</button>
    </form>
</body>
</html>
